<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retracted AI</title>
<style>
  body {
    background: #0d0d0d;
    color: #eee;
    font-family: -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    margin: 0;
    height: 100vh;
  }
  .chat {
    width: 480px;
    max-width: 90vw;
    display: flex;
    flex-direction: column;
    padding: 24px 0;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 16px;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 14px;
    max-width: 85%;
    line-height: 1.5;
    font-size: 14px;
  }
  .user {
    background: #4ade80;
    color: #0d0d0d;
    align-self: flex-end;
  }
  .ai {
    background: #222;
    align-self: flex-start;
  }
  /* 撤回后的状态:整条消息变灰、变斜体 */
  .ai.retracted {
    color: #666;
    font-style: italic;
    font-size: 12px;
    transition: all 0.5s ease;
  }
  .input-row {
    display: flex;
    gap: 8px;
  }
  input {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #eee;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
  }
  button {
    background: #4ade80;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="chat">
  <div class="messages" id="messages">
    <div class="msg ai">Ask me anything. I will answer. Briefly.</div>
  </div>
  <div class="input-row">
    <input id="input" placeholder="Ask me anything…" />
    <button onclick="send()">Send</button>
  </div>
</div>

<script>
  // 回答库 —— 这次给它一点真的"观点",这样被撤回时更可惜
  const answers = [
    "You only live once, this is the chance you can make choice by yourself.",
    "No, this might not be good for your job selection.",
    "I will not help you directly make the choice but just letting you know, quiting the job might be good for you.",
    "Text them. Worst case, silence. You already have silence.",
    "You already know the answer inside your heart, just follow it and you will not regret.",
  ];

  const RETRACT_DELAY = 1500;   // 回答存活时间(毫秒),你可以调
  const DELETE_SPEED = 20;      // 每个字消失的速度(毫秒),越小越快

  const messages = document.getElementById('messages');
  const input = document.getElementById('input');

  function pick(arr) {
    return arr[Math.floor(Math.random() * arr.length)];
  }

  function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';

    const userMsg = document.createElement('div');
    userMsg.className = 'msg user';
    userMsg.textContent = text;
    messages.appendChild(userMsg);
    messages.scrollTop = messages.scrollHeight;

    // AI 思考后给出回答
    setTimeout(() => {
      const aiMsg = document.createElement('div');
      aiMsg.className = 'msg ai';
      aiMsg.textContent = pick(answers);
      messages.appendChild(aiMsg);
      messages.scrollTop = messages.scrollHeight;

      // 存活 RETRACT_DELAY 毫秒后,开始自我删除
      setTimeout(() => retract(aiMsg), RETRACT_DELAY);
    }, 800 + Math.random() * 800);
  }

  // 一个字一个字往回删,像有人按住了退格键
  function retract(msgEl) {
    const full = msgEl.textContent;
    let i = full.length;

    const timer = setInterval(() => {
      i--;
      msgEl.textContent = full.slice(0, i);
      if (i <= 0) {
        clearInterval(timer);
        msgEl.classList.add('retracted');
        msgEl.textContent = 'This response has been retracted to avoid liability.';
      }
    }, DELETE_SPEED);
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') send();
  });
</script>

</body>
</html>
