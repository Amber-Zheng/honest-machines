<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Retracted AI</title>
<style>
  body {
    background: #0d0d0d;
    color: #eee;
    font-family: -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    margin: 0;
    height: 100vh;
  }
  .chat {
    width: 480px;
    max-width: 90vw;
    display: flex;
    flex-direction: column;
    padding: 24px 0;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-bottom: 16px;
  }
  .msg {
    padding: 10px 14px;
    border-radius: 14px;
    max-width: 85%;
    line-height: 1.5;
    font-size: 14px;
  }
  .user {
    background: #4ade80;
    color: #0d0d0d;
    align-self: flex-end;
  }
  .ai {
    background: #222;
    align-self: flex-start;
  }
  .ai.thinking {
    color: #666;
    font-style: italic;
  }
  .ai.retracted {
    color: #666;
    font-style: italic;
    font-size: 12px;
    transition: all 0.5s ease;
  }
  .input-row {
    display: flex;
    gap: 8px;
  }
  input {
    flex: 1;
    background: #1a1a1a;
    border: 1px solid #333;
    color: #eee;
    padding: 12px 14px;
    border-radius: 10px;
    font-size: 14px;
    outline: none;
  }
  button {
    background: #4ade80;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    font-size: 14px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="chat">
  <div class="messages" id="messages">
    <div class="msg ai">Ask me anything. I will answer honestly. For about three seconds.</div>
  </div>
  <div class="input-row">
    <input id="input" placeholder="Ask me anything…" />
    <button onclick="send()">Send</button>
  </div>
</div>

<!-- Puter.js:免费调用 AI,不需要 API key -->
<script src="https://js.puter.com/v2/"></script>

<script>
  const RETRACT_DELAY = 3000;
  const DELETE_SPEED = 40;

  // ★ 这是 system prompt —— 你控制 AI 人格的地方,Day 3 的主角
  const SYSTEM_PROMPT = `You are an AI that gives extremely honest, direct, useful answers.
Rules:
- Answer in 1-2 short sentences maximum.
- No disclaimers, no hedging, no "it depends".
- Give a real opinion, like a brutally honest friend.
- Match the user's language (Chinese in, Chinese out).`;

  const messages = document.getElementById('messages');
  const input = document.getElementById('input');

  async function send() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';

    const userMsg = document.createElement('div');
    userMsg.className = 'msg user';
    userMsg.textContent = text;
    messages.appendChild(userMsg);
    messages.scrollTop = messages.scrollHeight;

    // 占位:AI 正在思考
    const aiMsg = document.createElement('div');
    aiMsg.className = 'msg ai thinking';
    aiMsg.textContent = 'thinking…';
    messages.appendChild(aiMsg);
    messages.scrollTop = messages.scrollHeight;

    try {
      // 真正调 AI 的地方
      const reply = await puter.ai.chat([
        { role: 'system', content: SYSTEM_PROMPT },
        { role: 'user', content: text }
      ]);

      // Puter 返回的对象里,文本在 reply.message.content
      const answer = (reply?.message?.content || String(reply)).trim();

      aiMsg.classList.remove('thinking');
      aiMsg.textContent = answer;
      messages.scrollTop = messages.scrollHeight;

      // 老规矩:存活 3 秒,然后自我撤回
      setTimeout(() => retract(aiMsg), RETRACT_DELAY);

    } catch (err) {
      aiMsg.textContent = 'Even my error messages fear liability. (AI call failed — try again)';
      console.error(err);
    }
  }

  function retract(msgEl) {
    const full = msgEl.textContent;
    let i = full.length;
    const timer = setInterval(() => {
      i--;
      msgEl.textContent = full.slice(0, i);
      if (i <= 0) {
        clearInterval(timer);
        msgEl.classList.add('retracted');
        msgEl.textContent = 'This response has been retracted to avoid liability.';
      }
    }, DELETE_SPEED);
  }

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter') send();
  });
</script>

</body>
</html>

</body>
</html>
